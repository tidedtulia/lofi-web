name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/lofi-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_API_KEY=${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY }}
            NEXT_PUBLIC_TYPE_1=${{ secrets.NEXT_PUBLIC_TYPE_1 }}
            NEXT_PUBLIC_TYPE_2=${{ secrets.NEXT_PUBLIC_TYPE_2 }}
            NEXT_PUBLIC_TYPE_3=${{ secrets.NEXT_PUBLIC_TYPE_3 }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: lofi-web-app
          resourceGroup: lofi-web-group
          imageToDeploy: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/lofi-web:${{ github.sha }}
          registryUrl: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          registryUsername: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
          targetPort: 3000
          ingress: external
          environmentVariables: CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
