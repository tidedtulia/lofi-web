services:
  lofi-web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_CLOUDINARY_API_KEY: ${NEXT_PUBLIC_CLOUDINARY_API_KEY}
        NEXT_PUBLIC_TYPE_1: ${NEXT_PUBLIC_TYPE_1}
        NEXT_PUBLIC_TYPE_2: ${NEXT_PUBLIC_TYPE_2}
        NEXT_PUBLIC_TYPE_3: ${NEXT_PUBLIC_TYPE_3}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
